[project]
name = "elevenlabs-buyer-agent"
version = "0.1.0"
description = "Australian residential buyer agency voice agent built on ElevenLabs Conversational AI platform"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=1.50.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
buyer-agent = "src.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"
