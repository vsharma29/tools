[project]
name = "buyer-voice-agent"
version = "0.1.0"
description = "Voice agent for Australian residential buyer agency — interviews prospects and generates buyer briefs"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "anthropic-agentkit>=0.1.0",
    "deepgram-sdk>=3.4.0",
    "cartesia>=1.0.0",
    "openai>=1.40.0",
    "twilio>=9.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.111.0",
    "websockets>=12.0",
    "mangum>=0.17.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "moto[s3]>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
